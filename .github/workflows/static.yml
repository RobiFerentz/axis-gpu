# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build library
        run: bun run build

      - name: Build examples
        run: |
          # Transpile each example TypeScript file to JavaScript
          for ts_file in examples/*.ts; do
            if [ -f "$ts_file" ]; then
              js_file="${ts_file%.ts}.js"
              echo "Building $ts_file -> $js_file"
              bun build "$ts_file" --outfile "$js_file" --target browser --format esm
            fi
          done

      - name: Create deployment directory
        run: |
          mkdir -p _site
          # Copy the built library files
          cp -r dist _site/dist
          echo "Copied dist files:"
          ls -la _site/dist/

          # Copy the examples
          mkdir -p _site/examples
          cp examples/*.html _site/examples/
          cp examples/*.js _site/examples/
          cp examples/*.md _site/examples/ 2>/dev/null || true

          echo "Files in _site/examples:"
          ls -la _site/examples/

          # Update HTML files to reference .js instead of .ts
          for html_file in _site/examples/*.html; do
            if [ -f "$html_file" ]; then
              echo "Updating script references in $html_file"
              sed -i 's/\.ts"/.js"/g' "$html_file"
            fi
          done

          # Fix absolute paths for GitHub Pages project deployment
          # Replace /examples/ with ./examples/ in the examples index
          if [ -f "_site/examples/index.html" ]; then
            echo "Fixing paths in examples/index.html for GitHub Pages"
            sed -i 's|href="/examples/|href="./|g' _site/examples/index.html
          fi

          # Fix navigation links in example HTML files
          for html_file in _site/examples/*.html; do
            if [ -f "$html_file" ] && [ "$(basename "$html_file")" != "index.html" ]; then
              echo "Fixing navigation paths in $html_file"
              # Fix home link: /examples/ -> ./
              sed -i 's|href="/examples/"|href="./"|g' "$html_file"
              # Fix example file links to use relative paths
              sed -i 's|href="01-basic-setup.html"|href="./01-basic-setup.html"|g' "$html_file"
              sed -i 's|href="02-primitives.html"|href="./02-primitives.html"|g' "$html_file"
              sed -i 's|href="03-animation.html"|href="./03-animation.html"|g' "$html_file"
              sed -i 's|href="04-scene-graph.html"|href="./04-scene-graph.html"|g' "$html_file"
            fi
          done

          # Create a root index.html that redirects to examples
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=examples/index.html">
            <script>
              // Backup JavaScript redirect
              window.location.href = 'examples/index.html';
            </script>
            <title>Axis GPU - Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="examples/index.html">examples</a>...</p>
          </body>
          </html>
          EOF

          echo "Final _site structure:"
          find _site -type f | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
